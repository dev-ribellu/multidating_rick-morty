<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multidating</title>
    <link rel="stylesheet" href="style/index.css">
</head>
<body>
    <button id="toggleFavorites" class="favorites-toggle">❤️ Favoris</button>
    
    <div id="favoritesSidebar" class="favorites-sidebar">
        <div class="sidebar-header">
            <h2>Mes Favoris</h2>
            <button id="closeSidebar" class="close-btn">✕</button>
        </div>
        <div id="favoritesList" class="favorites-list">
            <!-- Les favoris seront affichés ici -->
        </div>
    </div>
    
    <h1>Welcome to Multidating</h1>
    <p>Your go-to platform for exploring multiple dating options!</p>

    <div class="main-container">
        <div class="preferences-section">
            <div class="preferences-header">
                <h2>Preferences</h2>
                <button type="button" id="togglePreferences" class="toggle-btn">▼</button>
            </div>
            <form id="preferencesForm">
        
        <label>Status</label>
        <div class="list-box" id="status">
            <label class="checkbox-item">
                <input type="radio" name="status" value="alive">
                <span>Vivant</span>
            </label>
            <label class="checkbox-item">
                <input type="radio" name="status" value="dead">
                <span>Mort</span>
            </label>
            <label class="checkbox-item">
                <input type="radio" name="status" value="unknown">
                <span>Inconnu</span>
            </label>
        </div>

        <label>Gender</label>
        <div class="list-box" id="gender">
            <label class="checkbox-item">
                <input type="radio" name="gender" value="male">
                <span>Homme</span>
            </label>
            <label class="checkbox-item">
                <input type="radio" name="gender" value="female">
                <span>Femme</span>
            </label>
            <label class="checkbox-item">
                <input type="radio" name="gender" value="genderless">
                <span>Sans genre</span>
            </label>
            <label class="checkbox-item">
                <input type="radio" name="gender" value="unknown">
                <span>Inconnu</span>
            </label>
        </div>

        <label>Species</label>
        <div class="list-box scrollable" id="species">
            <!-- Les options seront ajoutées dynamiquement -->
        </div>

        <label>Location</label>
        <div class="list-box scrollable" id="location">
            <!-- Les options seront ajoutées dynamiquement -->
        </div>

        <input type="submit" value="Find Matches">
            </form>
        </div>

        <div id="result" class="result-section">
            <!-- Les résultats seront affichés ici -->
        </div>
    </div>

    <script src="script/preferences.js"></script>
</body>
</html>
